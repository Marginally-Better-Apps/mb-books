name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  conventions:
    name: Conventional PR title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate squash commit title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node scripts/conventional.cjs

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: SwiftLint
        # Pinned by digest: realm/swiftlint 0.65.1.
        run: >-
          docker run --rm -v "$PWD:/work" -w /work
          ghcr.io/realm/swiftlint@sha256:f47e083201e47a136cda5ae847595bfe00226c444ca226fa74fa5dc648a9b057
          swiftlint lint --strict --reporter github-actions-logging
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: ESLint
        run: npm run lint

  build:
    name: Validate and build
    # Liquid Glass and Icon Composer icons need the iOS 26 SDK.
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
      GALA_BUILD_DIR: ${{ github.workspace }}/.ci-build
      GALA_ARTIFACT_DIR: ${{ github.workspace }}/artifacts
      GALA_JOBS: 3
      HOMEBREW_NO_AUTO_UPDATE: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Install build tools
        run: brew install xcodegen actionlint
      - run: npm ci --ignore-scripts
      - name: Validate release tooling and workflows
        run: |
          npm test
          python3 -m unittest discover -s scripts -p 'test_*.py'
          actionlint
          bash -n ios-build.sh ios-test.sh scripts/version.sh .githooks/commit-msg
          xcodegen generate
          git diff --exit-code -- MBBooks.xcodeproj
      - name: Run unit and UI tests on a simulator
        env:
          MB_WARNINGS_AS_ERRORS: 'YES'
        run: ./ios-test.sh
      - name: Save test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: .ci-build/TestResults.xcresult
          if-no-files-found: ignore
          retention-days: 7
      - name: Build and validate device IPA
        run: ./ios-build.sh
      - name: Save unsigned IPA, checksum, and build metadata
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-unsigned
          path: artifacts/
          if-no-files-found: error
          retention-days: 14

  release:
    name: Release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [conventions, lint, build]
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
      GALA_BUILD_DIR: ${{ github.workspace }}/.ci-build
      GALA_ARTIFACT_DIR: ${{ github.workspace }}/artifacts
      GALA_JOBS: 3
      HOMEBREW_NO_AUTO_UPDATE: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: brew install xcodegen
      - run: npm ci --ignore-scripts
      - name: Bump version, build IPA, tag, and publish release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release
